name: shlb-local-prototype

x-demo-backend: &demo-backend
  build:
    context: .
    dockerfile: demo-backend/Dockerfile
  image: shlb/demo-backend:phase1
  restart: unless-stopped
  environment:
    VERSION_ID: demo-v1
  expose:
    - "8080"
  secrets:
    - fault_control_token
  networks:
    - backend_net
    - observability_net
  read_only: true
  tmpfs:
    - /tmp:size=8m,mode=1777
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    interval: 3s
    timeout: 2s
    retries: 10
    start_period: 3s
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"
  mem_limit: 96m
  pids_limit: 128

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: shlb
      POSTGRES_USER: shlb_api
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - control_data_net
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/run/postgresql:size=4m,mode=0770
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shlb_api -d shlb"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 8s

  redis:
    image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'user default on >%s ~* &* +@all\n' "$$(cat /run/secrets/redis_password)" > /tmp/users.acl
        exec redis-server --aclfile /tmp/users.acl --appendonly yes --appendfsync everysec
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      - control_data_net
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=0700
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 96
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  control-api:
    build:
      context: .
      dockerfile: control-api/Dockerfile
    image: shlb/control-api:phase2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SHLB_ENVIRONMENT: local
      SHLB_DATABASE_HOST: postgres
      SHLB_DATABASE_PORT: "5432"
      SHLB_DATABASE_NAME: shlb
      SHLB_DATABASE_USER: shlb_api
      SHLB_REDIS_HOST: redis
      SHLB_REDIS_PORT: "6379"
      SHLB_COOKIE_SECURE: "true"
      SHLB_ALLOWED_ORIGINS: ${SHLB_ALLOWED_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443}
    secrets:
      - postgres_password
      - redis_password
      - bootstrap_password
      - field_encryption_key
    expose:
      - "8000"
    networks:
      - api_edge_net
      - control_data_net
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 12s

  control-worker:
    build:
      context: .
      dockerfile: control-api/Dockerfile
    image: shlb/control-worker:prototype
    entrypoint: ["/app/worker-entrypoint.sh"]
    restart: unless-stopped
    depends_on:
      control-api:
        condition: service_healthy
      traffic-haproxy:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    environment:
      SHLB_ENVIRONMENT: local
      SHLB_DATABASE_HOST: postgres
      SHLB_DATABASE_PORT: "5432"
      SHLB_DATABASE_NAME: shlb
      SHLB_DATABASE_USER: shlb_api
      SHLB_REDIS_HOST: redis
      SHLB_REDIS_PORT: "6379"
      SHLB_HAPROXY_RUNTIME_SOCKET: /var/run/haproxy/admin.sock
      SHLB_PROMETHEUS_URL: http://prometheus:9090
      SHLB_ELASTICSEARCH_URL: http://elasticsearch:9200
      SHLB_FAULT_TOKEN_FILE: /run/secrets/fault_control_token
    secrets:
      - postgres_password
      - redis_password
      - bootstrap_password
      - field_encryption_key
      - fault_control_token
    volumes:
      - haproxy-runtime:/var/run/haproxy
    networks:
      - control_data_net
      - backend_net
      - observability_net
    group_add:
      - "1000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 128
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "python", "-m", "shlb_api.worker_health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  edge-nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: shlb/edge-nginx:phase1
    restart: unless-stopped
    depends_on:
      traffic-haproxy:
        condition: service_healthy
    ports:
      - "0.0.0.0:8081:8080"
      - "0.0.0.0:8443:8443"
    volumes:
      - ./.local-certs:/etc/nginx/tls:ro
    networks:
      - data_edge_net
      - api_edge_net
      - observability_net
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=2m,mode=0755
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    pids_limit: 96
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s

  traffic-haproxy:
    build:
      context: .
      dockerfile: haproxy/Dockerfile
    image: shlb/traffic-haproxy:phase1
    restart: unless-stopped
    depends_on:
      demo-backend-a:
        condition: service_healthy
      demo-backend-b:
        condition: service_healthy
      demo-backend-c:
        condition: service_healthy
      logstash:
        condition: service_healthy
    expose:
      - "8080"
      - "8404"
    volumes:
      - ./haproxy:/usr/local/etc/haproxy:ro
      - haproxy-runtime:/var/run/haproxy
      - haproxy-state:/var/lib/haproxy
    networks:
      data_edge_net: {}
      backend_net: {}
      observability_net: {}
    security_opt:
      - no-new-privileges:true
    mem_limit: 160m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg >/dev/null && printf 'show info\\n' | socat - UNIX-CONNECT:/var/run/haproxy/admin.sock | grep -q '^Name:' && wget -q -O /dev/null http://127.0.0.1:8404/healthz"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 8s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --storage.tsdb.retention.size=256MB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - observability_net
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - observability_net
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./observability/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - logstash-data:/usr/share/logstash/data
    expose:
      - "514"
      - "9600"
    networks:
      - observability_net
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /usr/share/logstash/logs:size=16m,mode=0750
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9600/_node/pipelines >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
      TELEMETRY_OPTIN: "false"
    expose:
      - "5601"
    networks:
      - observability_net
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /usr/share/kibana/data:size=64m,mode=0750
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  traffic-generator:
    build:
      context: .
      dockerfile: traffic-generator/Dockerfile
    image: shlb/traffic-generator:prototype
    restart: unless-stopped
    depends_on:
      traffic-haproxy:
        condition: service_healthy
    environment:
      TARGET_HOST: traffic-haproxy
      TARGET_PORT: "8080"
      REQUESTS_PER_SECOND: "40"
    networks:
      - data_edge_net
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  demo-backend-a:
    <<: *demo-backend
    environment:
      INSTANCE_ID: inst-a
      VERSION_ID: demo-v1

  demo-backend-b:
    <<: *demo-backend
    environment:
      INSTANCE_ID: inst-b
      VERSION_ID: demo-v1

  demo-backend-c:
    <<: *demo-backend
    environment:
      INSTANCE_ID: inst-c
      VERSION_ID: demo-v1

networks:
  data_edge_net:
    driver: bridge
  api_edge_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
  control_data_net:
    driver: bridge
    internal: true
  observability_net:
    driver: bridge
    internal: true

volumes:
  haproxy-runtime:
  haproxy-state:
  postgres-data:
  redis-data:
  prometheus-data:
  elasticsearch-data:
  logstash-data:

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  redis_password:
    file: ./.secrets/redis_password
  bootstrap_password:
    file: ./.secrets/bootstrap_password
  field_encryption_key:
    file: ./.secrets/field_encryption_key
  fault_control_token:
    file: ./.secrets/fault_control_token
