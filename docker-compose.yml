name: shlb-phase1

x-demo-backend: &demo-backend
  build:
    context: .
    dockerfile: demo-backend/Dockerfile
  image: shlb/demo-backend:phase1
  restart: unless-stopped
  environment:
    VERSION_ID: demo-v1
  expose:
    - "8080"
  networks:
    - backend_net
  read_only: true
  tmpfs:
    - /tmp:size=8m,mode=1777
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    interval: 3s
    timeout: 2s
    retries: 10
    start_period: 3s

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: shlb
      POSTGRES_USER: shlb_api
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - control_data_net
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/run/postgresql:size=4m,mode=0770
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shlb_api -d shlb"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 8s

  redis:
    image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'user default on >%s ~* &* +@all\n' "$$(cat /run/secrets/redis_password)" > /tmp/users.acl
        exec redis-server --aclfile /tmp/users.acl --appendonly yes --appendfsync everysec
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      - control_data_net
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=0700
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  control-api:
    build:
      context: .
      dockerfile: control-api/Dockerfile
    image: shlb/control-api:phase2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SHLB_ENVIRONMENT: local
      SHLB_DATABASE_HOST: postgres
      SHLB_DATABASE_PORT: "5432"
      SHLB_DATABASE_NAME: shlb
      SHLB_DATABASE_USER: shlb_api
      SHLB_REDIS_HOST: redis
      SHLB_REDIS_PORT: "6379"
      SHLB_COOKIE_SECURE: "true"
      SHLB_ALLOWED_ORIGINS: https://localhost:8443,https://127.0.0.1:8443
    secrets:
      - postgres_password
      - redis_password
      - bootstrap_password
      - field_encryption_key
    expose:
      - "8000"
    networks:
      - edge_net
      - control_data_net
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 12s

  edge-nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: shlb/edge-nginx:phase1
    restart: unless-stopped
    depends_on:
      traffic-haproxy:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8443:8443"
    networks:
      - edge_net
    tmpfs:
      - /etc/nginx/tls:size=4m,mode=0700
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=2m,mode=0755
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s

  traffic-haproxy:
    build:
      context: .
      dockerfile: haproxy/Dockerfile
    image: shlb/traffic-haproxy:phase1
    restart: unless-stopped
    depends_on:
      demo-backend-a:
        condition: service_healthy
      demo-backend-b:
        condition: service_healthy
      demo-backend-c:
        condition: service_healthy
    expose:
      - "8080"
      - "8404"
      - "5555"
    volumes:
      - ./haproxy:/usr/local/etc/haproxy:rw
      - haproxy-runtime:/var/run/haproxy
      - haproxy-state:/var/lib/haproxy
    networks:
      edge_net: {}
      backend_net: {}
      control_net:
        ipv4_address: 172.30.0.10
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg >/dev/null && printf 'show info\\n' | socat - UNIX-CONNECT:/var/run/haproxy/haproxy.sock | grep -q '^Name:' && wget -q -O /dev/null --header 'Authorization: Basic cGhhc2UxX2FkbWluOnBoYXNlMV9vbmx5X2NoYW5nZV9tZQ==' http://172.30.0.10:5555/v3/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 8s

  demo-backend-a:
    <<: *demo-backend
    environment:
      INSTANCE_ID: inst-a
      VERSION_ID: demo-v1

  demo-backend-b:
    <<: *demo-backend
    environment:
      INSTANCE_ID: inst-b
      VERSION_ID: demo-v1

  demo-backend-c:
    <<: *demo-backend
    environment:
      INSTANCE_ID: inst-c
      VERSION_ID: demo-v1

networks:
  edge_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
  control_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  control_data_net:
    driver: bridge
    internal: true

volumes:
  haproxy-runtime:
  haproxy-state:
  postgres-data:
  redis-data:

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  redis_password:
    file: ./.secrets/redis_password
  bootstrap_password:
    file: ./.secrets/bootstrap_password
  field_encryption_key:
    file: ./.secrets/field_encryption_key
