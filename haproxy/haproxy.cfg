global
  maxconn 4096
  stats socket /var/run/haproxy/haproxy.sock user haproxy group haproxy mode 0660 level admin expose-fd listeners
  log stdout format raw local0

defaults unnamed_defaults_1
  mode http
  log global
  option httplog
  option dontlognull
  option http-keep-alive
  timeout check 2s
  timeout connect 2s
  timeout client 30s
  timeout server 30s

frontend fe_application from unnamed_defaults_1
  bind :8080
  acl route_public path -i /public
  acl route_public path_beg -i /public/
  acl route_auth path -i /auth
  acl route_auth path_beg -i /auth/
  acl route_catalog path -i /catalog
  acl route_catalog path_beg -i /catalog/
  acl route_checkout path -i /checkout
  acl route_checkout path_beg -i /checkout/
  use_backend be_public if route_public
  use_backend be_auth if route_auth
  use_backend be_catalog if route_catalog
  use_backend be_checkout if route_checkout
  default_backend be_unmapped

frontend fe_stats from unnamed_defaults_1
  bind :8404
  stats enable
  stats uri /stats
  stats refresh 5s
  http-request use-service prometheus-exporter if { path /metrics }
  http-request return status 200 content-type text/plain string "ok\n" if { path /healthz }

backend be_auth from unnamed_defaults_1
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  server srv_inst_a demo-backend-a:8080 check weight 100
  server srv_inst_b demo-backend-b:8080 check weight 100
  server srv_inst_c demo-backend-c:8080 check weight 100

backend be_catalog from unnamed_defaults_1
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  server srv_inst_a demo-backend-a:8080 check weight 100
  server srv_inst_b demo-backend-b:8080 check weight 100
  server srv_inst_c demo-backend-c:8080 check weight 100

backend be_checkout from unnamed_defaults_1
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  server srv_inst_a demo-backend-a:8080 check weight 100
  server srv_inst_b demo-backend-b:8080 check weight 100
  server srv_inst_c demo-backend-c:8080 check weight 100

backend be_public from unnamed_defaults_1
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  server srv_inst_a demo-backend-a:8080 check weight 100
  server srv_inst_b demo-backend-b:8080 check weight 100
  server srv_inst_c demo-backend-c:8080 check weight 100

backend be_unmapped from unnamed_defaults_1
  http-request return status 404 content-type application/json string '{"error":"unmapped_route"}'
