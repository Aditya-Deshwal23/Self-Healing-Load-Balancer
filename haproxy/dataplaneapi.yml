config_version: 2
name: shlb-phase1-dataplane
dataplaneapi:
  host: 172.30.0.10
  port: 5555
  advertised:
    api_address: ""
    api_port: 0
  scheme:
  - http
  userlist:
    userlist: controller
    userlist_file: ""
  transaction:
    transaction_dir: /tmp/dataplaneapi/transactions
    backups_number: 3
    backups_dir: /tmp/dataplaneapi/backups
    max_open_transactions: 5
  resources:
    maps_dir: /tmp/dataplaneapi/maps
    ssl_certs_dir: /tmp/dataplaneapi/ssl
    general_storage_dir: /tmp/dataplaneapi/general
    dataplane_storage_dir: /tmp/dataplaneapi/storage
    spoe_dir: /tmp/dataplaneapi/spoe
  user:
  - name: phase1_admin
    insecure: true
    password: phase1_only_change_me
haproxy:
  config_file: /usr/local/etc/haproxy/haproxy.cfg
  haproxy_bin: /usr/local/sbin/haproxy
  master_runtime: /var/run/haproxy-master.sock
  master_worker_mode: true
  reload:
    reload_delay: 5
    reload_cmd: /package/admin/s6/command/s6-svc -2 /run/service/haproxy
    restart_cmd: /package/admin/s6/command/s6-svc -t /run/service/haproxy
    reload_strategy: custom
log:
  log_to: stdout
  log_level: info
  log_format: JSON
