user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 1m;

    log_format structured escape=json
        '{"timestamp":"$time_iso8601","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';
    access_log /var/log/nginx/access.log structured;
    error_log /var/log/nginx/error.log warn;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 308 https://$host:8443$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate /etc/nginx/tls/lab.crt;
        ssl_certificate_key /etc/nginx/tls/lab.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 10m;
        ssl_session_cache shared:TLS:1m;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api/v1/events {
            set $control_api control-api:8000;
            proxy_pass http://$control_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 75s;
            proxy_set_header Connection "";
        }

        location /api/ {
            set $control_api control-api:8000;
            proxy_pass http://$control_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
        }

        location ~ ^/(public|auth|catalog|checkout)(?:/|$) {
            proxy_pass http://traffic-haproxy:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 1s;
            proxy_read_timeout 30s;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri.html $uri/ /index.html;
        }
    }
}
